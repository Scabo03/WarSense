# Integrazione continua: a ogni invio esegue l'INTERO collaudo (05 §14.1), cioè
# le prove del pacchetto, quelle ospitate e quelle d'interfaccia sul simulatore.
# Fino al 2026-08-05 si fermava a `swift test`, e le 44 prove di livello
# applicativo — quelle al livello in cui i difetti riferiti si sono manifestati —
# non erano cancello per nulla (esame-critico.md §C4).
# Il «tutto» ha una sola definizione, `scripts/collaudo-completo.sh`, invocata
# anche dallo script di caricamento: due elenchi separati tornerebbero a divergere.
# Nessun caricamento su TestFlight da qui: il caricamento è un atto deliberato,
# eseguito in locale con scripts/carica-testflight.sh.
name: collaudo
on:
  push:
    branches: [principale]
  pull_request:
jobs:
  collaudo:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Il controllo di freschezza della nota per il titolare confronta due
          # commit: senza la cronologia intera `git log` non li trova.
          fetch-depth: 0
      - name: Versione di Swift
        run: swift --version
      - name: xcodegen
        run: brew install xcodegen
      - name: Collaudo completo (pacchetto, ospitate, interfaccia)
        run: ./scripts/collaudo-completo.sh
      - name: I documenti consegnati nominano solo ciò che il codice espone
        # Si saltano i controlli che chiedono il programma di verifica o la
        # cronologia: misure e freschezza stanno nel caricamento, che è il momento
        # in cui i documenti vengono davvero consegnati.
        run: python3 scripts/controlla-note.py --senza-programma
