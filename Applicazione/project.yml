# Progetto applicativo che assembla il pacchetto (05 §1.2). Generato con xcodegen:
# il file di progetto Xcode è un artefatto, questo è la sorgente di verità.
# La versione di marketing ha qui la sua unica sorgente di verità (MARKETING_VERSION);
# il numero di build viene da TestFlight a ogni caricamento (scripts/carica-testflight.sh).
name: WarSense
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  WarSensePacchetto:
    path: ../Codice
schemes:
  WarSense:
    build:
      targets:
        WarSense: all
    test:
      targets: [WarSenseTest, WarSenseUITest]
targets:
  WarSense:
    type: application
    platform: iOS
    sources:
      - Sorgenti
      - Risorse
    dependencies:
      - package: WarSensePacchetto
        products: [Sessione, Motore, Dati, Contenuti, Segnali]
    info:
      path: Sorgenti/Info.plist
      properties:
        CFBundleDisplayName: WarSense
        # La versione ha un'unica sorgente di verità nelle impostazioni: il file
        # dichiara i riferimenti, mai valori letterali (vedi memoria-infrastruttura).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Dichiarazione sulla crittografia: nessun algoritmo di cifratura in uso.
        # Evita la domanda sull'esportazione a ogni caricamento su TestFlight.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scabo.warsense
        # La versione SALE SOLTANTO e non torna mai indietro (regola del titolare,
        # vedi memoria-infrastruttura): si cambia solo su sua richiesta esplicita.
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: D2KQYQ8YU8
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Firma manuale sul certificato di distribuzione già esistente (vincolo
          # assoluto: nessun certificato nuovo, nessuna revoca). Il profilo è
          # specifico di questa applicazione e riusa quel certificato.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.scabo.warsense"

  WarSenseTest:
    type: bundle.unit-test
    platform: iOS
    sources: [ProveOspitate]
    dependencies:
      - target: WarSense
      # Le prove ospitate giocano le sessioni che il programma di verifica genera:
      # la lista è una sola (05 §12.4). Il confine di 05 §1.3 vale per la
      # Presentazione, non per un bersaglio di prova, che non entra nell'archivio.
      - package: WarSensePacchetto
        products: [Verifica]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WarSense.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WarSense
        BUNDLE_LOADER: $(TEST_HOST)
  WarSenseUITest:
    type: bundle.ui-testing
    platform: iOS
    sources: [ProveInterfaccia]
    dependencies:
      - target: WarSense
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
